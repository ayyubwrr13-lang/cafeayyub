<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ayyub Cafe</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff7ed;
            color: #333;
        }

        header {
            background: #6f4e37;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin: 0;
            font-size: 40px;
        }

        header p {
            margin-bottom: 0;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 25px;
        }

        /* FOTO */
        .foto {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .foto img {
            width: 250px;
            height: 200px;
            object-fit: cover;
            border-radius: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(200px, 1fr)
            );
            gap: 20px;
            margin-top: 25px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
            text-align: center;
        }

        .card h3 {
            color: #6f4e37;
        }

        form {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-top: 30px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #6f4e37;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #4e342e;
        }

        footer {
            text-align: center;
            background: #6f4e37;
            color: white;
            padding: 15px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header>
        <h1>Ayyub Cafe</h1>
        <p>Tempat Nongkrong dan Menikmati Kopi</p>
    </header>

    <div class="container">

        <!-- FOTO CAFE -->
        <div class="foto">

            <img
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQMMA2zpCHI_Xsizl6XNb4kpAW1OAeHJ0JUnqv1PshTBw&s=10"
                alt="Kopi Susu"
            >

            <img
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ8B44ch2OjhdDN4RsoQnVgTX7JvrZJqxXlJLFULUH46g&s=10"
                alt="Americano"
            >

            <img
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT7x9M8mnpj4_sa4s6mZBi7gGTIjTNtyW2yMc_mxN3-Pw&s=10"
                alt="Kopi Kampoeng Djawa"
            >

        </div>

        <!-- MENU -->
        <h2>Menu Ayyub Cafe</h2>

        <div class="menu">

            <div class="card">
                <h3>☕ Kopi Susu</h3>
                <p>Kopi susu creamy dan nikmat.</p>
                <strong>Rp15.000</strong>
            </div>

            <div class="card">
                <h3>☕ Americano</h3>
                <p>Minuman kopi pahit tanpa gula.</p>
                <strong>Rp17.000</strong>
            </div>

            <div class="card">
                <h3>☕ Kopi Kampoeng Djawa</h3>
                <p>Kopi Kampoeng Djawa khas Ayyub Cafe.</p>
                <strong>Rp18.000</strong>
            </div>

        </div>

        <!-- FORM PEMESANAN -->
        <form action="order.php" method="POST">

            <h2>Form Pemesanan</h2>

            <label>Nama</label>

            <input
                type="text"
                name="nama"
                placeholder="Masukkan nama"
                required
            >

            <label>Nomor Telepon</label>

            <input
                type="text"
                name="telepon"
                placeholder="Masukkan nomor telepon"
                required
            >

            <label>Pilih Menu</label>

            <select name="menu" required>

                <option value="">
                    -- Pilih Menu --
                </option>

                <option value="Kopi Susu">
                    Kopi Susu - Rp15.000
                </option>

                <option value="Americano">
                    Americano - Rp17.000
                </option>

                <option value="Kopi Kampoeng Djawa">
                    Kopi Kampoeng Djawa - Rp18.000
                </option>

            </select>

            <label>Alamat</label>

            <textarea
                name="alamat"
                rows="4"
                placeholder="Masukkan alamat"
                required
            ></textarea>

            <button type="submit">
                Pesan Sekarang
            </button>

        </form>

    </div>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 Ayyub Cafe</p>
    </footer>

</body>
</html>
